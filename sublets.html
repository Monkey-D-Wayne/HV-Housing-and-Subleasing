<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sublets · Happy Valley Housing</title>
<meta name="description" content="Penn State student sublets and lease takeovers near University Park. Every poster has a confirmed psu.edu email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sublets.css">
</head>
<body class="sub">
<header id="head">
  <div class="bar">
    <a class="brand" href="./">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M5 25 L13 13 L18 19 L22 14 L29 25 Z" fill="var(--accent-ink)"/><rect x="15" y="21" width="4" height="4" fill="var(--accent)"/></svg>
      <div>Happy Valley Housing<small>Student sublets near Penn State</small></div>
    </a>
    <div class="search" role="search">
      <label for="q" class="grow"><span>Search</span><input id="q" type="search" placeholder="Building or street"></label>
      <label for="maxp"><span>Max / month</span><span class="rangebox"><input id="maxp" type="range" min="300" max="2000" step="50" value="2000"><output id="maxpv">Any</output></span></label>
      <label for="from"><span>Move in by</span><input id="from" type="date"></label>
      <label for="sort"><span>Sort</span><select id="sort"><option value="best">Most verified</option><option value="price">Lowest price</option><option value="start">Soonest move-in</option><option value="new">Newest</option></select></label>
    </div>
    <div class="acct">
      <button class="btn primary" id="postbtn"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" fill="none"/></svg>Post a sublet</button>
      <button class="btn" id="acctbtn">Sign in</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<main>
  <section class="list">
    <div class="listhead">
      <h1 id="count">Sublets near Penn State</h1>
      <p>Every poster confirmed a psu.edu email</p>
    </div>
    <div class="notice" id="demonote" hidden role="note"><b>Demo mode.</b> These are example listings, not real ones. Anything you post here is saved only in this browser until the sublets database is connected.</div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="mapwrap" aria-label="Map">
    <div id="map"></div>
  </aside>
</main>
<button class="maptoggle" id="maptoggle"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3l4-2 6 2 4-2v12l-4 2-6-2-4 2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Show map</span></button>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<dialog id="auth"><div class="dlg form" id="authbody"></div></dialog>
<dialog id="post"><div class="dlg form" id="postbody"></div></dialog>
<dialog id="mine"><div class="dlg form" id="minebody"></div></dialog>
<dialog id="lb" aria-label="Photos"><div class="lbwrap"><div class="lbtop"><span class="lbcap"></span><button class="lbclose" aria-label="Close photos">×</button></div><div class="lbstage"><button class="lbprev" aria-label="Previous photo">‹</button><div class="lbimg"></div><button class="lbnext" aria-label="Next photo">›</button></div><div class="lbthumbs"></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="sublets.js"></script>
</body>
</html>
